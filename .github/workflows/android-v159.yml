name: Android 1.5.9 · release build and checks

on:
  push:
    branches: ["release/1.5.9"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HDR_NDK_VERSION: "30.0.16248370"
      HDR_BUILD_JOBS: "4"
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            gradle/wrapper/gradle-wrapper.properties
      - name: Install the pinned Android toolchain
        shell: bash
        run: |
          mkdir -p dist
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;$HDR_NDK_VERSION" "cmake;3.22.1" 2>&1 | tee dist/toolchain.log
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$HDR_NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build native code and the release APK
        shell: bash
        run: |
          mkdir -p dist
          bash build.sh 2>&1 | tee dist/build.log
      - name: Run library, recovery and API 102 checks
        shell: bash
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror experiments/recorder/tests/frame_gate_test.cpp -o /tmp/hdr159-frame-test
          /tmp/hdr159-frame-test | tee dist/recorder-tests.log
          c++ -std=c++17 -pthread -Wall -Wextra -Werror experiments/recorder/tests/fence_wait_test.cpp -o /tmp/hdr159-fence-test
          /tmp/hdr159-fence-test | tee -a dist/recorder-tests.log
          c++ -std=c++17 -Wall -Wextra -Werror experiments/recorder/tests/capture_frame_test.cpp -o /tmp/hdr159-capture-test
          /tmp/hdr159-capture-test | tee -a dist/recorder-tests.log
          bash tests/run-host-tests.sh 2>&1 | tee dist/checks.log
          bash tests/build-device-tests.sh 2>&1 | tee dist/device-tests-build.log
          bash tests/build-image-tests.sh 2>&1 | tee dist/image-tests-build.log
          cp build/image-tests/dex/classes.dex dist/image-device-tests.dex
      - name: Verify packaging and record provenance
        shell: bash
        run: |
          python3 tools/verify-apk.py dist/unsigned.apk | tee dist/packaging-checks.log
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging dist/unsigned.apk > dist/apk-info.txt
          cp RELEASE_NOTES-1.5.9.txt dist/RELEASE_NOTES-1.5.9.txt
          python3 tools/ci-artifacts.py
      - name: Upload the cloud-built APK, source and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MI-Screen-HDR-Enhanced-1.5.9-release-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
