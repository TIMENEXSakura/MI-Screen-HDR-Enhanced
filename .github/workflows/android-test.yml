name: Android test build (unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - fix/semantic-library-resolution

permissions:
  contents: read

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HDR_BUILD_JOBS: '2'
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          mkdir -p build/ci-logs
          # Signing stays on the maintainer's machine. These files never exist in CI.
          echo "HDR_KEYSTORE=$RUNNER_TEMP/miuihdr-unsigned-only/no-keystore.p12" >> "$GITHUB_ENV"
          echo "HDR_PASSWORD_FILE=$RUNNER_TEMP/miuihdr-unsigned-only/no-password.txt" >> "$GITHUB_ENV"
          sdkmanager --install 'platforms;android-37.0' 'build-tools;37.0.0' \
            'ndk;28.2.13676358' 'cmake;3.31.6' 2>&1 | tee build/ci-logs/toolchain.log
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "HDR_CMAKE=$ANDROID_HOME/cmake/3.31.6/bin/cmake" >> "$GITHUB_ENV"
          echo "HDR_PLATFORM_JAR=$ANDROID_HOME/platforms/android-37.0/android.jar" >> "$GITHUB_ENV"
          java -version 2>&1 | tee -a build/ci-logs/toolchain.log
          gcc --version | tee -a build/ci-logs/toolchain.log
          python3 --version | tee -a build/ci-logs/toolchain.log

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          cache-read-only: false

      - name: Test semantic matching, library lookup, and installation recovery
        shell: bash
        env:
          CC: gcc
        run: bash tools/ci-host-tests.sh 2>&1 | tee build/ci-logs/host-tests.log

      - name: Build native payload and unsigned release APK
        shell: bash
        run: bash build.sh 2>&1 | tee build/ci-logs/build.log

      - name: Test API 102 hooks and ordinary app runtime boundaries
        shell: bash
        run: python3 tests/test_libxposed_hooks.py 2>&1 | tee build/ci-logs/libxposed-tests.log

      - name: Verify APK and collect test artifacts
        shell: bash
        run: python3 tools/ci-artifacts.py 2>&1 | tee build/ci-logs/apk-checks.log

      - name: Upload unsigned test APK and source
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: mi-screen-hdr-api102-unsigned-${{ github.run_number }}
          path: build/ci-artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build and test reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: mi-screen-hdr-api102-reports-${{ github.run_number }}
          path: |
            build/ci-logs/
            build/reports/
            build/outputs/mapping/release/
          if-no-files-found: warn
          retention-days: 14

      - name: Explain testing artifact
        if: success()
        shell: bash
        run: |
          {
            echo '### Test build only'
            echo 'The APK is unsigned. The maintainer must sign it locally before installation.'
            echo 'The signing key never enters this workflow. No GitHub Release is created.'
            echo 'Test APK, exact source archive, SHA-256 checksums, and build/test reports are attached as workflow artifacts.'
          } >> "$GITHUB_STEP_SUMMARY"
